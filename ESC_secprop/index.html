<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단면 특성 계산기 (2D Canvas)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; height: 100vh; display: flex; }
        #left-panel {
            width: 300px;
            min-width: 300px;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid #ccc;
        }
        #right-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1 1 0;
            min-height: 0;
            border-bottom: 2px solid #ccc;
            overflow: hidden;
            position: relative;
        }
        #sectionCanvas {
            display: block;
        }
        #results-container {
            flex: 0 0 320px;
            padding: 15px 20px;
            overflow: auto;
            display: flex;
            justify-content: center;
        }
        .result-table { border-collapse: collapse; font-size: 13px; margin: 0 auto; }
        .result-table th, .result-table td { border: 1px solid #aaa; padding: 5px 12px; }
        .result-table th { background-color: #e8e8e8; text-align: center; }
        .result-table td:first-child, .result-table td:nth-child(3) { text-align: left; }
        .result-table td:nth-child(2), .result-table td:nth-child(4),
        .result-table td:nth-child(5), .result-table td:nth-child(6) { text-align: right; }
        .piece-row { cursor: pointer; }
        .piece-row:hover { background-color: #f0f0c0 !important; }
        .piece-row.neg { background-color: #fff0f0; }
        .piece-row.highlighted { background-color: #fff3a0 !important; font-weight: bold; }
        .piece-row.neg.highlighted { background-color: #ffd980 !important; font-weight: bold; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        #error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="left-panel">
        <h1 style="font-size:1.3em; margin-bottom:10px;">단면 특성 계산기</h1>
        <p id="inputHint" style="font-size:13px; margin-bottom:10px;">주의: 절점을 시계 방향 또는 반시계 방향으로 일관되게 입력하세요. 방향은 상관없지만 순서는 연속적이어야 합니다.</p>
        <div style="display:flex; gap:5px; align-items:center; margin-bottom:8px;">
            <label style="font-size:13px; white-space:nowrap;">입력 방식:</label>
            <select id="inputMode" style="flex:1; padding:4px;" onchange="onInputModeChange()">
                <option value="polygon">폐곡선 (좌표열)</option>
                <option value="pieces">조각 (직사각형/직각삼각형)</option>
            </select>
        </div>
        <div style="display:flex; gap:5px; align-items:center; margin-bottom:8px;">
            <label style="font-size:13px; white-space:nowrap;">재료 수:</label>
            <select id="materialCount" style="flex:1; padding:4px;" onchange="onMaterialCountChange()">
                <option value="1">1개</option>
                <option value="2">2개 (환산단면)</option>
            </select>
        </div>
        <div id="materialDefRow" style="display:none; flex-direction:column; gap:5px; margin-bottom:10px; padding:8px; background:#f5f5f5; border-radius:4px; font-size:12px;">
            <div style="display:flex; gap:5px; align-items:center;">
                <label style="white-space:nowrap; width:55px;">재료1 E:</label>
                <input type="number" id="E1" style="flex:1; padding:3px;" value="1" step="any" onchange="onMaterialDefChange()">
                <label style="white-space:nowrap;"><input type="radio" name="refMat" value="1" checked onchange="onMaterialDefChange()"> 기준</label>
            </div>
            <div style="display:flex; gap:5px; align-items:center;">
                <label style="white-space:nowrap; width:55px;">재료2 E:</label>
                <input type="number" id="E2" style="flex:1; padding:3px;" value="1" step="any" onchange="onMaterialDefChange()">
                <label style="white-space:nowrap;"><input type="radio" name="refMat" value="2" onchange="onMaterialDefChange()"> 기준</label>
            </div>
            <div id="ratioDisplay" style="color:#555;"></div>
        </div>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <select id="exampleSelect" style="flex:1; padding:8px;">
                <option value="hollow">중공 직사각형</option>
                <option value="steelbox">강박스거더</option>
            </select>
            <button onclick="loadExample()" style="width:auto; padding:8px 12px; background-color:#2196F3; white-space:nowrap;">예제 불러오기</button>
        </div>
        <div style="display:flex; gap:5px; align-items:center; margin-bottom:8px;">
            <label style="font-size:13px; white-space:nowrap;">입력 단위:</label>
            <select id="inputUnit" style="flex:1; padding:4px;" onchange="onUnitChange()">
                <option value="mm">mm</option>
                <option value="cm">cm</option>
                <option value="m">m</option>
            </select>
            <label style="font-size:13px; white-space:nowrap; margin-left:5px;">출력 단위:</label>
            <select id="outputUnit" style="flex:1; padding:4px;" onchange="onUnitChange()">
                <option value="mm">mm</option>
                <option value="cm">cm</option>
                <option value="m">m</option>
            </select>
        </div>
        <div id="calcMethodRow" style="display:flex; gap:5px; align-items:center; margin-bottom:10px;">
            <label style="font-size:13px; white-space:nowrap;">계산 방법:</label>
            <select id="calcMethod" style="flex:1; padding:4px;" onchange="onMethodChange()">
                <option value="green">Green 정리 (선적분)</option>
                <option value="composite">사다리꼴 분할 (도심축정리)</option>
            </select>
        </div>
        <div id="shape1Label" style="display:none; font-size:12px; font-weight:bold; margin-bottom:3px;">재료1 형상</div>
        <textarea id="coordinates" placeholder="첫줄: 변수 (예: H=2, B=1, t=0.2)&#10;이후: 점번호,x수식,y수식 (예:&#10;p1,0,0&#10;p2,p1.x+B,p1.y&#10;p3,p2.x,p2.y+H&#10;p4,0,p3.y)"></textarea>
        <div id="shape2Label" style="display:none; font-size:12px; font-weight:bold; margin-bottom:3px;">재료2 형상</div>
        <textarea id="coordinates2" style="display:none;" placeholder="재료2 형상을 입력 (재료1과 동일한 문법)"></textarea>
        <button onclick="calculateProperties()">계산</button>
        <div id="error"></div>
    </div>
    <div id="right-panel">
        <div id="canvas-container">
            <canvas id="sectionCanvas"></canvas>
            <button onclick="resetView()" style="position:absolute; top:8px; right:8px; width:auto; padding:4px 10px; font-size:12px; background:#666; opacity:0.8;">뷰 리셋</button>
        </div>
        <div id="results-container">
            <div id="results"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sectionCanvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        let centroid = null;
        let lastRawResult = null;  // 입력 단위 기준 원본 결과 저장
        let currentMethod = 'green';  // 'green' 또는 'composite'
        let currentInputMode = 'polygon';  // 'polygon' 또는 'pieces'
        let pieces = [];                   // pieces 모드의 사용자 조각 목록 (matIdx 포함)
        let points2 = [];                  // polygon 모드의 재료2 폐곡선 점들
        let highlightedLabel = null;       // 클릭으로 강조된 조각 라벨
        let materialCount = 1;             // 1 또는 2
        let E1 = 1, E2 = 1;                // 재료별 탄성계수
        let refMatIdx = 1;                 // 기준 재료 (1 또는 2)
        const MAT_COLORS = {
            1: { fill: 'rgba(70,150,90,0.30)',  stroke: 'rgba(20,100,40,0.85)' },
            2: { fill: 'rgba(70,130,200,0.30)', stroke: 'rgba(20,70,160,0.85)' }
        };

        function getNFor(matIdx) {
            if (materialCount === 1) return 1;
            const E_ref = refMatIdx === 1 ? E1 : E2;
            if (!E_ref || E_ref === 0) return 1;
            return (matIdx === 1 ? E1 : E2) / E_ref;
        }

        function updateRatioDisplay() {
            const el = document.getElementById('ratioDisplay');
            if (!el) return;
            const E_ref = refMatIdx === 1 ? E1 : E2;
            const n1 = E_ref ? E1 / E_ref : 1;
            const n2 = E_ref ? E2 / E_ref : 1;
            el.innerHTML = `기준재료 = M${refMatIdx} (E<sub>ref</sub>=${E_ref})` +
                ` · n<sub>1</sub>=${n1.toFixed(4)}, n<sub>2</sub>=${n2.toFixed(4)}`;
        }

        function onMaterialCountChange() {
            materialCount = parseInt(document.getElementById('materialCount').value, 10);
            const show2 = materialCount === 2;
            document.getElementById('materialDefRow').style.display = show2 ? 'flex' : 'none';
            document.getElementById('shape1Label').style.display = show2 ? 'block' : 'none';
            document.getElementById('shape2Label').style.display = show2 ? 'block' : 'none';
            document.getElementById('coordinates2').style.display = show2 ? 'block' : 'none';
            points = []; points2 = []; pieces = [];
            centroid = null; lastRawResult = null; highlightedLabel = null;
            if (show2) updateRatioDisplay();
            renderResultTable(null);
            updateShape();
        }

        function onMaterialDefChange() {
            E1 = parseFloat(document.getElementById('E1').value) || 1;
            E2 = parseFloat(document.getElementById('E2').value) || 1;
            const refChecked = document.querySelector('input[name="refMat"]:checked');
            refMatIdx = refChecked ? parseInt(refChecked.value, 10) : 1;
            updateRatioDisplay();
            if (lastRawResult) {
                // 재료비만 바뀌어도 재계산 필요
                calculateProperties();
            }
        }

        function highlightPiece(label) {
            highlightedLabel = (highlightedLabel === label) ? null : label;
            if (lastRawResult) renderResultTable(lastRawResult);
            drawSection();
        }

        function onInputModeChange() {
            currentInputMode = document.getElementById('inputMode').value;
            points = [];
            pieces = [];
            centroid = null;
            lastRawResult = null;
            highlightedLabel = null;
            // 계산방법 행은 폐곡선 모드에서만 사용 (조각 모드는 항상 사다리꼴 분할 결과 동일)
            document.getElementById('calcMethodRow').style.display =
                currentInputMode === 'polygon' ? 'flex' : 'none';
            updateExampleList();
            updatePlaceholder();
            document.getElementById('coordinates').value = '';
            document.getElementById('error').textContent = '';
            renderResultTable(null);
            drawSection();
        }

        function updateExampleList() {
            const sel = document.getElementById('exampleSelect');
            sel.innerHTML = currentInputMode === 'polygon'
                ? '<option value="hollow">중공 직사각형</option>' +
                  '<option value="steelbox">강박스거더</option>' +
                  '<option value="psc">PSC거더</option>' +
                  '<option value="steelbox_slab">강박스+슬래브 (합성)</option>' +
                  '<option value="psc_slab">PSC거더+슬래브 (합성)</option>'
                : '<option value="ibeam">I-빔</option>' +
                  '<option value="steelbox_p">강박스거더</option>' +
                  '<option value="psc_p">PSC거더</option>' +
                  '<option value="steelbox_slab_p">강박스+슬래브 (합성)</option>' +
                  '<option value="psc_slab_p">PSC거더+슬래브 (합성)</option>';
        }

        function updatePlaceholder() {
            const ta = document.getElementById('coordinates');
            const hint = document.getElementById('inputHint');
            if (currentInputMode === 'polygon') {
                ta.placeholder = '첫줄: 변수 (예: H=2, B=1, t=0.2)\n이후: 점번호,x수식,y수식 (예:\np1,0,0\np2,p1.x+B,p1.y\np3,p2.x,p2.y+H\np4,0,p3.y)';
                hint.textContent = '주의: 절점을 시계 방향 또는 반시계 방향으로 일관되게 입력하세요. 방향은 상관없지만 순서는 연속적이어야 합니다.';
            } else {
                ta.placeholder = '첫줄: 변수 (예: B=300, H=500, t=20)\n이후: 이름,R|T,x,y,b,h\n  R: 삽입점=한 코너, b·h=폭·높이 (부호로 방향 지정)\n  T: 직각삼각형, 직각=삽입점, 다른 두 꼭짓점=(x+b,y),(x,y+h)\n예:\nbf,R,0,0,B,t\nweb,R,(B-t)/2,t,t,H-2*t';
                hint.textContent = '각 줄: 이름, 유형(R/T), 삽입점 (x,y), 폭 b, 높이 h. b/h 부호는 직각이 바운딩 박스의 어느 코너에 있는지 결정 (면적은 항상 양수).';
            }
        }

        // 단위 변환: toMm 기준 환산 계수
        const unitToMm = { mm: 1, cm: 10, m: 1000 };

        function getUnitScale() {
            const inU = document.getElementById('inputUnit').value;
            const outU = document.getElementById('outputUnit').value;
            // 입력단위 → mm → 출력단위
            return unitToMm[inU] / unitToMm[outU];
        }

        function onUnitChange() {
            if (lastRawResult) renderResultTable(lastRawResult);
        }

        function onMethodChange() {
            currentMethod = document.getElementById('calcMethod').value;
            if (lastRawResult) {
                renderResultTable(lastRawResult);
                drawSection();
            }
        }

        // 줌/패닝 상태
        let viewZoom = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;

        function resetView() {
            viewZoom = 1;
            panX = 0;
            panY = 0;
            drawSection();
        }

        // 마우스 휠 → 줌
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            const oldZoom = viewZoom;
            const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            viewZoom *= factor;
            viewZoom = Math.max(0.1, Math.min(viewZoom, 50));

            // 마우스 위치 기준 줌
            panX = mx - (mx - panX) * (viewZoom / oldZoom);
            panY = my - (my - panY) * (viewZoom / oldZoom);

            drawSection();
        });

        // 마우스 드래그 → 패닝
        canvas.addEventListener('mousedown', (e) => {
            isPanning = true;
            panStartX = e.clientX - panX;
            panStartY = e.clientY - panY;
            canvas.style.cursor = 'grabbing';
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            panX = e.clientX - panStartX;
            panY = e.clientY - panStartY;
            drawSection();
        });
        canvas.addEventListener('mouseup', () => {
            isPanning = false;
            canvas.style.cursor = 'grab';
        });
        canvas.addEventListener('mouseleave', () => {
            isPanning = false;
            canvas.style.cursor = 'grab';
        });

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            canvas.style.cursor = 'grab';
            drawSection();
        }

        function drawSection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isPieces = currentInputMode === 'pieces';
            let allVerts;
            if (isPieces) {
                if (!pieces || pieces.length === 0) return;
                allVerts = pieces.flatMap(p => p.vertices);
            } else {
                const havePoly1 = points.length >= 3;
                const havePoly2 = materialCount === 2 && points2.length >= 3;
                if (!havePoly1 && !havePoly2) return;
                allVerts = [];
                if (havePoly1) allVerts = allVerts.concat(points.map(p => [p.x, p.y]));
                if (havePoly2) allVerts = allVerts.concat(points2.map(p => [p.x, p.y]));
            }

            const margin = 40;
            const minX = Math.min(...allVerts.map(v => v[0]));
            const maxX = Math.max(...allVerts.map(v => v[0]));
            const minY = Math.min(...allVerts.map(v => v[1]));
            const maxY = Math.max(...allVerts.map(v => v[1]));
            const drawW = canvas.width - 2 * margin;
            const drawH = canvas.height - 2 * margin;
            if (drawW <= 0 || drawH <= 0) return;
            if (maxX === minX || maxY === minY) return;
            const baseScale = Math.min(drawW / (maxX - minX), drawH / (maxY - minY)) * 0.85;

            // 도형을 그리기 영역 중앙에 배치
            const shapeW = (maxX - minX) * baseScale;
            const shapeH = (maxY - minY) * baseScale;
            const baseOffsetX = margin + (drawW - shapeW) / 2;
            const baseOffsetY = margin + (drawH - shapeH) / 2;

            const scale = baseScale * viewZoom;

            function transformX(x) {
                const bx = (x - minX) * baseScale + baseOffsetX;
                return (bx - canvas.width / 2) * viewZoom + canvas.width / 2 + panX;
            }
            function transformY(y) {
                const by = canvas.height - ((y - minY) * baseScale + baseOffsetY);
                return (by - canvas.height / 2) * viewZoom + canvas.height / 2 + panY;
            }

            const showTriangles = isPieces
                || (currentMethod === 'composite'
                    && lastRawResult && lastRawResult.compositeData);

            // 폐곡선 모드: 외곽선 (재료별 색상)
            function drawPolygon(pts, matIdx) {
                if (!pts || pts.length < 3) return;
                ctx.beginPath();
                ctx.moveTo(transformX(pts[0].x), transformY(pts[0].y));
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(transformX(pts[i].x), transformY(pts[i].y));
                }
                ctx.closePath();
                if (!showTriangles) {
                    ctx.fillStyle = MAT_COLORS[matIdx].fill;
                    ctx.fill();
                }
                ctx.strokeStyle = MAT_COLORS[matIdx].stroke;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            if (!isPieces) {
                drawPolygon(points, 1);
                if (materialCount === 2) drawPolygon(points2, 2);
            }

            // 조각 오버레이 (pieces 모드 항상 / polygon-composite 모드)
            if (showTriangles) {
                const cdata = lastRawResult && lastRawResult.compositeData;
                const drawPieces = isPieces ? pieces : cdata.triangles;

                // 기준선 y = y_ref (폐곡선-composite 모드만)
                if (!isPieces && cdata) {
                    const yRefScreen = transformY(cdata.y_ref);
                    ctx.setLineDash([4, 3]);
                    ctx.strokeStyle = 'rgba(120,120,120,0.7)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(transformX(minX) - 25, yRefScreen);
                    ctx.lineTo(transformX(maxX) + 25, yRefScreen);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(80,80,80,0.85)';
                    ctx.font = '11px Arial';
                    ctx.fillText('기준선 y = ' + cdata.y_ref,
                        transformX(maxX) + 28, yRefScreen + 4);
                }

                // 직사각형 (재료별 색상)
                ctx.lineWidth = 1.2;
                for (const p of drawPieces) {
                    if (p.type !== 'rect') continue;
                    const v = p.vertices;
                    const mat = MAT_COLORS[p.matIdx || 1];
                    ctx.beginPath();
                    ctx.moveTo(transformX(v[0][0]), transformY(v[0][1]));
                    for (let k = 1; k < v.length; k++) {
                        ctx.lineTo(transformX(v[k][0]), transformY(v[k][1]));
                    }
                    ctx.closePath();
                    ctx.fillStyle = p.A > 0 ? mat.fill : 'rgba(200,90,90,0.10)';
                    ctx.fill();
                    ctx.strokeStyle = p.A > 0 ? mat.stroke : 'rgba(160,20,20,0.85)';
                    ctx.stroke();
                }

                // 삼각형 (재료별 색상)
                ctx.lineWidth = 1.5;
                for (const p of drawPieces) {
                    if (p.type !== 'tri') continue;
                    const v = p.vertices;
                    const mat = MAT_COLORS[p.matIdx || 1];
                    ctx.beginPath();
                    ctx.moveTo(transformX(v[0][0]), transformY(v[0][1]));
                    ctx.lineTo(transformX(v[1][0]), transformY(v[1][1]));
                    ctx.lineTo(transformX(v[2][0]), transformY(v[2][1]));
                    ctx.closePath();
                    ctx.fillStyle = p.A > 0 ? mat.fill : 'rgba(220,80,80,0.45)';
                    ctx.fill();
                    ctx.strokeStyle = p.A > 0 ? mat.stroke : 'rgba(170,0,0,0.95)';
                    ctx.stroke();
                }

                // 각 조각의 도심 (작은 주황 점)
                ctx.fillStyle = 'rgba(255,140,0,0.85)';
                for (const p of drawPieces) {
                    ctx.beginPath();
                    ctx.arc(transformX(p.cx), transformY(p.cy), 2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                // 조각 이름 라벨 (흰색 외곽선 + 본문)
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineJoin = 'round';
                for (const p of drawPieces) {
                    let lx, ly;
                    if (!isPieces && p.type === 'rect') {
                        // 폴리곤-composite 모드: 직사각형 상단(폐곡선 변) 바로 안쪽
                        const topMidX = (p.vertices[1][0] + p.vertices[2][0]) / 2;
                        const topY = p.vertices[1][1];
                        lx = transformX(topMidX);
                        ly = transformY(topY) + 10;
                    } else {
                        // pieces 모드 또는 삼각형: 도심 위치
                        lx = transformX(p.cx);
                        ly = transformY(p.cy);
                    }
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
                    ctx.strokeText(p.label, lx, ly);
                    ctx.fillStyle = p.type === 'tri'
                        ? (p.A > 0 ? '#005a00' : '#9b0000')
                        : (p.A > 0 ? '#143c8c' : '#8c1414');
                    ctx.fillText(p.label, lx, ly);
                }
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';

                // 클릭으로 강조된 조각: 두꺼운 주황 테두리
                if (highlightedLabel) {
                    const hp = drawPieces.find(pp => pp.label === highlightedLabel);
                    if (hp) {
                        const v = hp.vertices;
                        ctx.beginPath();
                        ctx.moveTo(transformX(v[0][0]), transformY(v[0][1]));
                        for (let k = 1; k < v.length; k++) {
                            ctx.lineTo(transformX(v[k][0]), transformY(v[k][1]));
                        }
                        ctx.closePath();
                        // 흰색 외곽 → 주황 본선 (이중 stroke로 가독성)
                        ctx.lineWidth = 6;
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                        ctx.stroke();
                        ctx.lineWidth = 3.5;
                        ctx.strokeStyle = '#ff6a00';
                        ctx.stroke();
                        ctx.lineWidth = 1;
                    }
                }

                // 폐곡선 외곽선 다시 그려 위로 올림 (폐곡선 모드만, 재료별 색상)
                if (!isPieces) {
                    function strokePoly(pts, matIdx) {
                        if (!pts || pts.length < 3) return;
                        ctx.beginPath();
                        ctx.moveTo(transformX(pts[0].x), transformY(pts[0].y));
                        for (let i = 1; i < pts.length; i++) {
                            ctx.lineTo(transformX(pts[i].x), transformY(pts[i].y));
                        }
                        ctx.closePath();
                        ctx.strokeStyle = MAT_COLORS[matIdx].stroke;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                    strokePoly(points, 1);
                    if (materialCount === 2) strokePoly(points2, 2);
                    ctx.lineWidth = 1;
                }
            }

            // 폴리곤 모드 강조: 폐곡선 행 클릭 시 해당 폐곡선 외곽선 강조
            if (!isPieces && highlightedLabel
                && lastRawResult && lastRawResult.polygonBreakdown) {
                const hp = lastRawResult.polygonBreakdown.find(pp => pp.label === highlightedLabel);
                if (hp && hp.vertices && hp.vertices.length >= 3) {
                    ctx.beginPath();
                    ctx.moveTo(transformX(hp.vertices[0][0]), transformY(hp.vertices[0][1]));
                    for (let k = 1; k < hp.vertices.length; k++) {
                        ctx.lineTo(transformX(hp.vertices[k][0]), transformY(hp.vertices[k][1]));
                    }
                    ctx.closePath();
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.stroke();
                    ctx.lineWidth = 3.5;
                    ctx.strokeStyle = '#ff6a00';
                    ctx.stroke();
                    ctx.lineWidth = 1;
                }
            }

            // 폐곡선 모드: 점/라벨 (두 폐곡선 모두)
            if (!isPieces) {
                ctx.font = '14px Arial';
                function drawPolyPoints(pts, color) {
                    if (!pts || pts.length === 0) return;
                    pts.forEach((point) => {
                        const x = transformX(point.x);
                        const y = transformY(point.y);
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.fillStyle = 'black';
                        ctx.fillText(point.id, x + 10, y - 10);
                    });
                }
                drawPolyPoints(points, '#c1272d');
                if (materialCount === 2) drawPolyPoints(points2, '#1e5fa8');
            }

            // Draw neutral axis (중립축) - dashed line through centroid
            if (centroid) {
                const naY = transformY(centroid.cy);
                ctx.beginPath();
                ctx.setLineDash([8, 4]);
                ctx.strokeStyle = 'blue';
                ctx.lineWidth = 1.5;
                ctx.moveTo(transformX(minX) - 20, naY);
                ctx.lineTo(transformX(maxX) + 20, naY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;

                // X-axis label
                ctx.fillStyle = 'blue';
                ctx.font = '12px Arial';
                ctx.fillText('x축 중립축 (N.A.x)', transformX(maxX) + 25, naY + 4);

                // Y neutral axis (y축 중립축) - vertical dashed line through centroid
                const naX = transformX(centroid.cx);
                ctx.beginPath();
                ctx.setLineDash([8, 4]);
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 1.5;
                ctx.moveTo(naX, transformY(minY) + 20);
                ctx.lineTo(naX, transformY(maxY) - 20);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;

                // Y-axis label
                ctx.fillStyle = 'red';
                ctx.font = '12px Arial';
                ctx.fillText('y축 중립축 (N.A.y)', naX + 8, transformY(maxY) - 25);
            }
        }

        // 폐곡선 좌표 텍스트를 점 배열로 파싱 (matIdx 태깅).
        function parsePolygonText(text, matIdx) {
            const lines = text.split('\n')
                .map(l => l.split(';')[0].trim())
                .filter(l => l.length > 0);
            const vars = {};
            const coordLines = [];
            for (const line of lines) {
                if (line.includes('=') && line.split(',').length <= line.split('=').length) {
                    const assigns = line.split(',');
                    for (const a of assigns) {
                        const m = a.trim().match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
                        if (m) {
                            try { vars[m[1]] = evaluateExpr(m[2], vars, {}); } catch(e){}
                        }
                    }
                } else {
                    coordLines.push(line);
                }
            }
            const pointMap = {};
            const pts = [];
            for (const line of coordLines) {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length < 3) continue;
                const id = parts[0];
                const xExpr = parts.slice(1, parts.length - 1).join(',');
                const yExpr = parts[parts.length - 1];
                try {
                    const x = evaluateExpr(xExpr, vars, pointMap);
                    const y = evaluateExpr(yExpr, vars, pointMap);
                    if (isNaN(x) || isNaN(y)) continue;
                    const pt = { id, x, y, matIdx };
                    pts.push(pt);
                    pointMap[id] = pt;
                } catch(e) { continue; }
            }
            return pts;
        }

        function updateShape() {
            const text1 = document.getElementById('coordinates').value;
            const text2 = document.getElementById('coordinates2').value;
            const err = document.getElementById('error');

            if (currentInputMode === 'pieces') {
                pieces = parsePieces(text1, 1);
                if (materialCount === 2) {
                    pieces = pieces.concat(parsePieces(text2, 2));
                }
                points = [];
                points2 = [];
                if (pieces.length === 0) {
                    err.textContent = '최소 1개 조각이 필요합니다 (이름,R|T,x,y,b,h)';
                } else {
                    err.textContent = '';
                }
                drawSection();
                return;
            }

            // polygon 모드
            points = parsePolygonText(text1, 1);
            points2 = materialCount === 2 ? parsePolygonText(text2, 2) : [];
            pieces = [];

            const totalPts = points.length + points2.length;
            if (points.length > 0 && points.length < 3) {
                err.textContent = '재료1 폐곡선은 최소 3개의 점이 필요합니다';
                return;
            }
            if (materialCount === 2 && points2.length > 0 && points2.length < 3) {
                err.textContent = '재료2 폐곡선은 최소 3개의 점이 필요합니다';
                return;
            }
            if (totalPts === 0) {
                err.textContent = '최소 3개의 점이 필요합니다';
                return;
            }
            err.textContent = '';
            drawSection();
        }

        function evaluateExpr(expr, vars, pointMap) {
            let s = expr.trim();
            // 점 참조 치환: p1.x, p1.y 등
            s = s.replace(/([a-zA-Z_]\w*)\.([xy])/g, (match, name, prop) => {
                if (pointMap[name]) return pointMap[name][prop];
                return match;
            });
            // 변수 치환 (긴 이름부터 치환하여 부분 매칭 방지)
            const varNames = Object.keys(vars).sort((a, b) => b.length - a.length);
            for (const name of varNames) {
                s = s.replace(new RegExp('\\b' + name + '\\b', 'g'), vars[name]);
            }
            return Function('"use strict"; return (' + s + ')')();
        }

        // 폐곡선 한 개의 도심 기준 단면특성(쉘레이스+평행축).
        function polygonProperties(pts) {
            if (!pts || pts.length < 3) return null;
            let area = 0, cx = 0, cy = 0;
            for (let i = 0; i < pts.length; i++) {
                const j = (i + 1) % pts.length;
                const xi = pts[i].x, yi = pts[i].y;
                const xj = pts[j].x, yj = pts[j].y;
                const dA = (xi * yj - xj * yi) / 2;
                area += dA;
                cx += (xi + xj) * dA;
                cy += (yi + yj) * dA;
            }
            if (Math.abs(area) < 1e-12) return null;
            cx /= (3 * area);
            cy /= (3 * area);
            let Ixx = 0, Iyy = 0, Ixy = 0;
            for (let i = 0; i < pts.length; i++) {
                const j = (i + 1) % pts.length;
                const xi = pts[i].x, yi = pts[i].y;
                const xj = pts[j].x, yj = pts[j].y;
                Ixx += ((yi*yi + yi*yj + yj*yj) * (xi*yj - xj*yi)) / 12;
                Iyy += ((xi*xi + xi*xj + xj*xj) * (xi*yj - xj*yi)) / 12;
                Ixy += ((xi*yj + 2*xi*yi + 2*xj*yj + xj*yi) * (xi*yj - xj*yi)) / 24;
            }
            return {
                A: Math.abs(area),
                cx, cy,
                Ixx_local: Math.abs(Ixx - area * cy * cy),
                Iyy_local: Math.abs(Iyy - area * cx * cx),
                Ixy_local: Ixy - area * cx * cy
            };
        }

        function calculateProperties() {
            if (currentInputMode === 'pieces') {
                calculateFromPieces();
                return;
            }
            // polygon 모드: 1개 또는 2개 폐곡선 → 환산단면 합산
            const err = document.getElementById('error');
            const polys = [];
            if (points.length >= 3) polys.push({ pts: points, matIdx: 1 });
            if (materialCount === 2 && points2.length >= 3) {
                polys.push({ pts: points2, matIdx: 2 });
            }
            if (polys.length === 0) {
                err.textContent = '최소 3개의 점이 필요합니다';
                document.getElementById('results').textContent = '';
                return;
            }

            // 폐곡선 각각을 "조각"으로 환산 후 합산
            const polyPieces = [];
            for (const poly of polys) {
                const props = polygonProperties(poly.pts);
                if (!props) continue;
                polyPieces.push({
                    name: 'poly' + poly.matIdx,
                    label: '폐곡선' + poly.matIdx,
                    type: 'polygon',
                    ids: ['polygon' + poly.matIdx],
                    matIdx: poly.matIdx,
                    vertices: poly.pts.map(p => [p.x, p.y]),
                    width: 0, height: 0,
                    A: props.A,
                    cx: props.cx, cy: props.cy,
                    Ixx_local: props.Ixx_local,
                    Iyy_local: props.Iyy_local,
                    Ixy_local: props.Ixy_local
                });
            }
            const polySummary = summarizePieces(polyPieces, 0);
            if (!polySummary) {
                err.textContent = '전체 면적이 0입니다';
                return;
            }
            err.textContent = '';
            const { area, cx, cy, Ixx, Iyy, Ixy } = polySummary;
            centroid = { cx, cy };

            // composite (사다리꼴 분할) 상세도 다중 폐곡선 통합 지원
            let compositeData = null;
            if (currentMethod === 'composite') {
                const allPieces = [];
                let totalRect = 0, totalTri = 0;
                let yRef = Infinity;
                for (const poly of polys) {
                    yRef = Math.min(yRef, ...poly.pts.map(p => p.y));
                    const c = computeComposite(poly.pts, poly.matIdx);
                    if (c) {
                        allPieces.push(...c.triangles);
                        totalRect += c.nRect;
                        totalTri += c.nTri;
                    }
                }
                compositeData = summarizePieces(allPieces, yRef);
                if (compositeData) {
                    compositeData.nRect = totalRect;
                    compositeData.nTri = totalTri;
                }
            }

            // 경계점 (전체 폐곡선 결합)
            const allPts = polys.flatMap(p => p.pts);
            const ptMaxY = allPts.reduce((a, b) => b.y > a.y ? b : a);
            const ptMinY = allPts.reduce((a, b) => b.y < a.y ? b : a);
            const ptMaxX = allPts.reduce((a, b) => b.x > a.x ? b : a);
            const ptMinX = allPts.reduce((a, b) => b.x < a.x ? b : a);

            lastRawResult = {
                area, cx, cy, Ixx, Iyy, Ixy,
                ptMaxY, ptMinY, ptMaxX, ptMinX,
                compositeData,
                polygonBreakdown: polyPieces,
                polygonSummary: polySummary
            };
            renderResultTable(lastRawResult);
            resizeCanvas();
        }

        // pieces 모드의 단면특성 계산: 사용자 조각 합산 + 환산단면 도심축정리.
        function calculateFromPieces() {
            const err = document.getElementById('error');
            if (!pieces || pieces.length === 0) {
                err.textContent = '최소 1개 조각이 필요합니다';
                document.getElementById('results').textContent = '';
                return;
            }
            const summary = summarizePieces(pieces, 0);
            if (!summary) {
                err.textContent = '전체 면적이 0입니다 (조각 부호 확인)';
                return;
            }
            err.textContent = '';
            const { area, cx, cy, Ixx, Iyy, Ixy } = summary;
            centroid = { cx, cy };

            let pMaxY = pieces[0], yMax = -Infinity;
            let pMinY = pieces[0], yMin = Infinity;
            let pMaxX = pieces[0], xMax = -Infinity;
            let pMinX = pieces[0], xMin = Infinity;
            for (const p of pieces) {
                for (const v of p.vertices) {
                    if (v[1] > yMax) { yMax = v[1]; pMaxY = p; }
                    if (v[1] < yMin) { yMin = v[1]; pMinY = p; }
                    if (v[0] > xMax) { xMax = v[0]; pMaxX = p; }
                    if (v[0] < xMin) { xMin = v[0]; pMinX = p; }
                }
            }
            lastRawResult = {
                area, cx, cy, Ixx, Iyy, Ixy,
                ptMaxY: { id: pMaxY.name, y: yMax },
                ptMinY: { id: pMinY.name, y: yMin },
                ptMaxX: { id: pMaxX.name, x: xMax },
                ptMinX: { id: pMinX.name, x: xMin },
                compositeData: summary
            };
            renderResultTable(lastRawResult);
            resizeCanvas();
        }

        // 직사각형/직각삼각형 한 조각의 속성 객체 생성 (pieces 모드용).
        // 면적은 항상 양수 (재료 추가). b/h 부호는 방향(어느 코너에 직각이 있는지)만 결정.
        // R: 삽입점(x,y) = 한 코너, 폭 b, 높이 h. 꼭짓점 (x,y)→(x+b,y)→(x+b,y+h)→(x,y+h).
        // T: 직각이 삽입점(x,y), 다른 두 꼭짓점 (x+b,y), (x,y+h).
        //    -- b,h 부호 4조합으로 직각이 바운딩 박스의 LL/LR/UR/UL 코너 표현.
        function buildPiece(name, type, x, y, b, h, matIdx) {
            const mi = matIdx || 1;
            if (type === 'R') {
                const A = Math.abs(b * h);
                return {
                    name, type: 'rect', label: name,
                    ids: [name], matIdx: mi,
                    vertices: [[x,y],[x+b,y],[x+b,y+h],[x,y+h]],
                    x, y, b, h,
                    A,
                    cx: x + b/2,
                    cy: y + h/2,
                    width: Math.abs(b),
                    height: Math.abs(h),
                    Ixx_local: A * h * h / 12,
                    Iyy_local: A * b * b / 12,
                    Ixy_local: 0
                };
            }
            const A = Math.abs(b * h) / 2;
            return {
                name, type: 'tri', label: name,
                ids: [name], matIdx: mi,
                vertices: [[x,y],[x+b,y],[x,y+h]],
                x, y, b, h,
                A,
                cx: x + b/3,
                cy: y + h/3,
                width: Math.abs(b),
                height: Math.abs(h),
                Ixx_local: A * h * h / 18,
                Iyy_local: A * b * b / 18,
                Ixy_local: -A * b * h / 36
            };
        }

        // pieces 모드 텍스트 파싱: "name, R|T, x, y, b, h" 행들 + 변수 라인.
        function parsePieces(text, matIdx) {
            const mi = matIdx || 1;
            const lines = text.split('\n')
                .map(l => l.split(';')[0].trim())
                .filter(l => l.length > 0);
            const vars = {};
            const dataLines = [];
            for (const line of lines) {
                if (line.includes('=') && line.split(',').length <= line.split('=').length) {
                    const assigns = line.split(',');
                    for (const a of assigns) {
                        const m = a.trim().match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
                        if (m) {
                            try { vars[m[1]] = evaluateExpr(m[2], vars, {}); } catch(e){}
                        }
                    }
                } else {
                    dataLines.push(line);
                }
            }
            const result = [];
            const seen = {};
            for (const line of dataLines) {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length < 6) continue;
                const name = parts[0];
                const type = parts[1].toUpperCase();
                if (type !== 'R' && type !== 'T') continue;
                if (seen[name]) continue;  // 중복 이름 무시
                try {
                    const x = evaluateExpr(parts[2], vars, {});
                    const y = evaluateExpr(parts[3], vars, {});
                    const b = evaluateExpr(parts[4], vars, {});
                    const h = evaluateExpr(parts[5], vars, {});
                    if ([x,y,b,h].some(v => isNaN(v))) continue;
                    if (Math.abs(b) < 1e-12 || Math.abs(h) < 1e-12) continue;
                    result.push(buildPiece(name, type, x, y, b, h, mi));
                    seen[name] = true;
                } catch(e) { continue; }
            }
            return result;
        }

        // 미리 만들어진 조각 목록에 대해 환산단면 도심축정리로 합산.
        // 각 조각의 matIdx에 따라 환산비 n = E_i / E_ref 적용.
        function summarizePieces(pieceList, refY) {
            if (!pieceList || pieceList.length === 0) return null;
            let A_t = 0, Sx_t = 0, Sy_t = 0, nRect = 0, nTri = 0;
            // 환산비 캐싱
            const nByMat = { 1: getNFor(1), 2: getNFor(2) };
            for (const p of pieceList) {
                const n = nByMat[p.matIdx || 1];
                p.n = n;
                p.A_t = p.A * n;     // 환산 면적
                A_t += p.A_t;
                Sx_t += p.A_t * p.cx;
                Sy_t += p.A_t * p.cy;
                if (p.type === 'rect') nRect++; else nTri++;
            }
            if (Math.abs(A_t) < 1e-12) return null;
            const Cx = Sx_t / A_t;
            const Cy = Sy_t / A_t;
            let Ixx_t = 0, Iyy_t = 0, Ixy_t = 0;
            for (const p of pieceList) {
                const ddx = p.cx - Cx;
                const ddy = p.cy - Cy;
                p.Ixx_parallel = p.A_t * ddy * ddy;
                p.Iyy_parallel = p.A_t * ddx * ddx;
                p.Ixy_parallel = p.A_t * ddx * ddy;
                p.Ixx_contrib = p.n * p.Ixx_local + p.Ixx_parallel;
                p.Iyy_contrib = p.n * p.Iyy_local + p.Iyy_parallel;
                p.Ixy_contrib = p.n * p.Ixy_local + p.Ixy_parallel;
                Ixx_t += p.Ixx_contrib;
                Iyy_t += p.Iyy_contrib;
                Ixy_t += p.Ixy_contrib;
            }
            return {
                triangles: pieceList,
                nRect, nTri,
                y_ref: refY ?? 0,
                A_signed: A_t,
                area: Math.abs(A_t),
                cx: Cx, cy: Cy,
                Ixx: Math.abs(Ixx_t),
                Iyy: Math.abs(Iyy_t),
                Ixy: Ixy_t
            };
        }

        // 각 변(P_i → P_{i+1})에 대해 기준선 y=y_ref까지의 사다리꼴 영역을
        //   - 직사각형 (xi,y_ref)-(xi,yi)-(xj,yi)-(xj,y_ref)  [가로 부분]
        //   - 삼각형 (xi,yi)-(xj,yj)-(xj,yi)                  [기울어진 윗부분]
        // 으로 분해. 수직 변(Δx=0)은 기여 없음, 수평 변(Δy=0)은 직사각형만 생성.
        // 각 조각의 도심 기준 국부 I 산출 후, 도심축정리로 합산.
        function computeComposite(pts, matIdx) {
            if (!pts || pts.length < 3) return null;
            const mi = matIdx || 1;
            const y_ref = Math.min(...pts.map(p => p.y));
            const pieces = [];
            let A_sum = 0, Sx = 0, Sy = 0;
            let nRect = 0, nTri = 0;
            const tag = mi === 1 ? '' : '·m2';

            for (let i = 0; i < pts.length; i++) {
                const j = (i + 1) % pts.length;
                const xi = pts[i].x, yi = pts[i].y;
                const xj = pts[j].x, yj = pts[j].y;
                const dx = xj - xi;
                const dy = yj - yi;
                if (Math.abs(dx) < 1e-12) continue;
                const ids = [pts[i].id, pts[j].id];
                const h_i = yi - y_ref;

                if (Math.abs(h_i) > 1e-12) {
                    const A = (xi - xj) * h_i;
                    const cx = (xi + xj) / 2;
                    const cy = (y_ref + yi) / 2;
                    nRect++;
                    pieces.push({
                        type: 'rect',
                        label: 'R' + nRect + tag,
                        ids,
                        matIdx: mi,
                        vertices: [[xi, y_ref], [xi, yi], [xj, yi], [xj, y_ref]],
                        A, cx, cy,
                        width: Math.abs(dx),
                        height: Math.abs(h_i),
                        Ixx_local: A * h_i * h_i / 12,
                        Iyy_local: A * dx * dx / 12,
                        Ixy_local: 0
                    });
                    A_sum += A;
                    Sx += A * cx;
                    Sy += A * cy;
                }

                if (Math.abs(dy) > 1e-12) {
                    const A = (xi - xj) * dy / 2;
                    const cx = (xi + 2 * xj) / 3;
                    const cy = (2 * yi + yj) / 3;
                    nTri++;
                    pieces.push({
                        type: 'tri',
                        label: 'T' + nTri + tag,
                        ids,
                        matIdx: mi,
                        vertices: [[xi, yi], [xj, yj], [xj, yi]],
                        A, cx, cy,
                        width: Math.abs(dx),
                        height: Math.abs(dy),
                        Ixx_local: A * dy * dy / 18,
                        Iyy_local: A * dx * dx / 18,
                        Ixy_local: A * dx * dy / 36
                    });
                    A_sum += A;
                    Sx += A * cx;
                    Sy += A * cy;
                }
            }

            if (Math.abs(A_sum) < 1e-12) return null;
            const Cx = Sx / A_sum;
            const Cy = Sy / A_sum;

            let Ixx = 0, Iyy = 0, Ixy = 0;
            for (const p of pieces) {
                const ddx = p.cx - Cx;
                const ddy = p.cy - Cy;
                p.Ixx_parallel = p.A * ddy * ddy;
                p.Iyy_parallel = p.A * ddx * ddx;
                p.Ixy_parallel = p.A * ddx * ddy;
                p.Ixx_contrib = p.Ixx_local + p.Ixx_parallel;
                p.Iyy_contrib = p.Iyy_local + p.Iyy_parallel;
                p.Ixy_contrib = p.Ixy_local + p.Ixy_parallel;
                Ixx += p.Ixx_contrib;
                Iyy += p.Iyy_contrib;
                Ixy += p.Ixy_contrib;
            }

            return {
                triangles: pieces,   // (필드명 유지) 직사각형 + 삼각형 조각 목록
                nRect, nTri, y_ref,
                A_signed: A_sum,
                area: Math.abs(A_sum),
                cx: Cx, cy: Cy,
                Ixx: Math.abs(Ixx),
                Iyy: Math.abs(Iyy),
                Ixy
            };
        }

                    't=0.2 ; 두께',
                    'p1,0,0            ; 외곽 좌하',
                    'p2,p1.x+B,p1.y   ; 외곽 우하',
                    'p3,p2.x,p2.y+H   ; 외곽 우상',
                    'p4,p1.x,p3.y     ; 외곽 좌상',
                    'p5,p1.x,p1.y     ; 브릿지',
                    'p6,p1.x+t,p1.y+t ; 내곽 좌하',
                    'p7,p6.x,p3.y-t   ; 내곽 좌상',
                    'p8,p2.x-t,p7.y   ; 내곽 우상',
                    'p9,p8.x,p6.y     ; 내곽 우하',
                    'p10,p6.x,p6.y    ; 브릿지',
                    'p11,p1.x,p1.y    ; 복귀',
                ].join('\n');
            } else if (type === 'steelbox') {
                data = [
                    'Bw=2500  ; 내공 폭',
                    'Hw=2500  ; 내공 높이',
                    'tf1=24   ; 상부플랜지 두께',
                    'tf2=20   ; 하부플랜지 두께',
                    'tw=14    ; 웹 두께',
                    'oh=30    ; 플랜지 돌출',
                    'sh=200   ; 보강재 높이',
                    'st=8     ; 보강재 두께',
                    '; --- 외곽 (시작: 하부플랜지 상면 ∩ 좌측웹 외측, 반시계방향) ---',
                    'o1,oh,tf2                 ; 시작점',
                    'o2,0,tf2                  ; 좌측 하부 돌출 상면 좌단',
                    'o3,0,0                    ; 좌하단',
                    'o4,2*oh+2*tw+Bw,0         ; 우하단',
                    'o5,o4.x,tf2               ; 우측 하부 돌출 상면 우단',
                    'o6,o4.x-oh,tf2            ; 하부플랜지 상면 ∩ 우측웹 외측',
                    'o7,o6.x,tf2+Hw            ; 상부플랜지 하면 ∩ 우측웹 외측',
                    'o8,o4.x,o7.y              ; 우측 상부 돌출 하면 우단',
                    'o9,o4.x,tf2+Hw+tf1        ; 우상단',
                    'o10,0,o9.y                ; 좌상단',
                    'o11,0,o7.y                ; 좌측 상부 돌출 하면 좌단',
                    'o12,oh,o7.y               ; 상부플랜지 하면 ∩ 좌측웹 외측',
                    '; --- 브릿지 (좌측웹 외측 하강 후 내곽으로 진입) ---',
                    'b1,oh,tf2                 ; = o1 위치 (좌측웹 외측 하단)',
                    'i1,oh+tw,tf2              ; 내곽 좌하 (좌측웹 내측 ∩ 하부플랜지 상면)',
                    '; --- 내곽 좌측 (UP) ---',
                    'i2,oh+tw,tf2+Hw           ; 내곽 좌상',
                    '; --- 내곽 상부 (좌→우, 상부보강재 4개: 각 보강재 CCW) ---',
                    'i3,oh+tw+Bw/5-st/2,tf2+Hw ; 상보강재1 TL',
                    'i4,i3.x,tf2+Hw-sh         ; BL',
                    'i5,i3.x+st,i4.y           ; BR',
                    'i6,i5.x,tf2+Hw            ; TR',
                    'i7,oh+tw+2*Bw/5-st/2,tf2+Hw ; 상보강재2 TL',
                    'i8,i7.x,tf2+Hw-sh',
                    'i9,i7.x+st,i8.y',
                    'i10,i9.x,tf2+Hw',
                    'i11,oh+tw+3*Bw/5-st/2,tf2+Hw ; 상보강재3 TL',
                    'i12,i11.x,tf2+Hw-sh',
                    'i13,i11.x+st,i12.y',
                    'i14,i13.x,tf2+Hw',
                    'i15,oh+tw+4*Bw/5-st/2,tf2+Hw ; 상보강재4 TL',
                    'i16,i15.x,tf2+Hw-sh',
                    'i17,i15.x+st,i16.y',
                    'i18,i17.x,tf2+Hw',
                    '; --- 내곽 우측 (DOWN) ---',
                    'i19,oh+tw+Bw,tf2+Hw       ; 내곽 우상',
                    'i20,i19.x,tf2             ; 내곽 우하',
                    '; --- 내곽 하부 (우→좌, 하부보강재 3개: 각 보강재 CCW) ---',
                    'i21,oh+tw+3*Bw/4+st/2,tf2 ; 하보강재3 BR',
                    'i22,i21.x,tf2+sh          ; TR',
                    'i23,i21.x-st,i22.y        ; TL',
                    'i24,i23.x,tf2             ; BL',
                    'i25,oh+tw+Bw/2+st/2,tf2   ; 하보강재2 BR',
                    'i26,i25.x,tf2+sh',
                    'i27,i25.x-st,i26.y',
                    'i28,i27.x,tf2',
                    'i29,oh+tw+Bw/4+st/2,tf2   ; 하보강재1 BR',
                    'i30,i29.x,tf2+sh',
                    'i31,i29.x-st,i30.y',
                    'i32,i31.x,tf2',
                    '; --- 내곽 좌측 끝 (cavity BL 복귀) ---',
                    'i33,oh+tw,tf2             ; 내곽 좌하 (= i1)',
                    '; --- 브릿지 복귀 (좌측웹 통과, 시작점으로 닫기) ---',
                    'i34,oh,tf2                ; = o1 위치 (닫기)',
                ].join('\n');
            }
            document.getElementById('inputUnit').value = inUnit;
            document.getElementById('outputUnit').value = inUnit;
            // 다중재료 예제: 재료 수 / E / 기준 먼저 적용 (onMaterialCountChange는 textarea를 읽음)
            if (exMatCount === 2) {
                document.getElementById('E1').value = exE1;
                document.getElementById('E2').value = exE2;
                const refRadio = document.querySelector(
                    `input[name="refMat"][value="${exRefMat}"]`);
                if (refRadio) refRadio.checked = true;
                E1 = exE1; E2 = exE2; refMatIdx = exRefMat;
                updateRatioDisplay();
            }
            document.getElementById('coordinates').value = data;
            document.getElementById('coordinates2').value = data2;
            if (materialCount !== exMatCount) {
                document.getElementById('materialCount').value = String(exMatCount);
                onMaterialCountChange();
            } else {
                updateShape();
            }
            lastRawResult = null;
            renderResultTable(null);
            viewZoom = 1; panX = 0; panY = 0;
        }

        function renderResultTable(d) {
            const outU = document.getElementById('outputUnit').value;
            const L = d ? getUnitScale() : 0;   // 길이 환산
            const L2 = L * L;                    // 면적
            const L3 = L2 * L;                   // 단면계수
            const L4 = L2 * L2;                  // 단면2차모멘트

            const fmt = (val) => val.toFixed(4);
            const v1 = (val) => d ? fmt(val * L) : '';    // 길이
            const v2 = (val) => d ? fmt(val * L2) : '';   // 면적
            const v3 = (val) => d ? fmt(val * L3) : '';   // 단면계수
            const v4 = (val) => d ? fmt(val * L4) : '';   // 단면2차모멘트
            const s = (val) => d ? val : '';

            const u = outU;
            const isComposite = materialCount === 2;
            const refLabel = isComposite ? ` (기준재료 M${refMatIdx})` : '';
            let html = `
                <table class="result-table">
                    <tr>
                        <th colspan="3">단면 특성${refLabel}</th>
                    </tr>
                    <tr>
                        <th>항목</th>
                        <th>값</th>
                        <th>단위</th>
                    </tr>
                    <tr>
                        <td>A${isComposite ? ' (환산)' : ''}</td>
                        <td>${d ? v2(d.area) : ''}</td>
                        <td>${u}²</td>
                    </tr>
                    <tr>
                        <td>Cx${isComposite ? ' (환산도심)' : ''}</td>
                        <td>${d ? v1(d.cx) : ''}</td>
                        <td>${u}</td>
                    </tr>
                    <tr>
                        <td>Cy${isComposite ? ' (환산도심)' : ''}</td>
                        <td>${d ? v1(d.cy) : ''}</td>
                        <td>${u}</td>
                    </tr>
                    <tr>
                        <td>Ixx${isComposite ? ' (환산)' : ''}</td>
                        <td>${d ? v4(d.Ixx) : ''}</td>
                        <td>${u}⁴</td>
                    </tr>
                    <tr>
                        <td>Iyy${isComposite ? ' (환산)' : ''}</td>
                        <td>${d ? v4(d.Iyy) : ''}</td>
                        <td>${u}⁴</td>
                    </tr>
                    <tr>
                        <td>Ixy${isComposite ? ' (환산)' : ''}</td>
                        <td>${d ? v4(d.Ixy) : ''}</td>
                        <td>${u}⁴</td>
                    </tr>
                </table>
            `;

            // 폴리곤 모드 + 다중재료: 폐곡선별 단면특성 + 환산 도심축정리 상세
            if (d && currentInputMode === 'polygon' && materialCount === 2
                && d.polygonBreakdown && d.polygonSummary) {
                html += renderPolygonBreakdown(d.polygonBreakdown, d.polygonSummary, L, L2, L4, u);
            }

            if (d && d.compositeData
                && (currentMethod === 'composite' || currentInputMode === 'pieces')) {
                html += renderCompositeBreakdown(d.compositeData, L, L2, L4, u);
            }

            document.getElementById('results').innerHTML = html;
        }

        function renderPolygonBreakdown(polyPieces, summary, L, L2, L4, u) {
            const fmt = (val) => val.toFixed(4);
            let rows = '';
            for (const p of polyPieces) {
                const matE = p.matIdx === 1 ? E1 : E2;
                const classes = ['piece-row'];
                if (highlightedLabel === p.label) classes.push('highlighted');
                rows += `
                    <tr class="${classes.join(' ')}" onclick="highlightPiece('${p.label}')" title="클릭하여 그림에서 강조">
                        <td><b>M${p.matIdx}</b> (${p.label})</td>
                        <td>${matE}</td>
                        <td>${(p.n != null ? p.n : 1).toFixed(4)}</td>
                        <td>${fmt(p.A * L2)}</td>
                        <td>${fmt(p.cx * L)}</td>
                        <td>${fmt(p.cy * L)}</td>
                        <td>${fmt(p.Ixx_local * L4)}</td>
                        <td>${fmt(p.Iyy_local * L4)}</td>
                        <td>${fmt(p.A_t * L2)}</td>
                        <td>${fmt((p.cy - summary.cy) * L)}</td>
                        <td>${fmt((p.cx - summary.cx) * L)}</td>
                        <td>${fmt(p.Ixx_parallel * L4)}</td>
                        <td>${fmt(p.Iyy_parallel * L4)}</td>
                        <td>${fmt(p.Ixx_contrib * L4)}</td>
                        <td>${fmt(p.Iyy_contrib * L4)}</td>
                    </tr>
                `;
            }
            const sumRow = `
                <tr style="background:#e8e8e8; font-weight:bold;">
                    <td colspan="3">Σ (환산 합계)</td>
                    <td>—</td>
                    <td>${fmt(summary.cx * L)}</td>
                    <td>${fmt(summary.cy * L)}</td>
                    <td colspan="2" style="text-align:center;">→</td>
                    <td>${fmt(summary.A_signed * L2)}</td>
                    <td colspan="4" style="text-align:center;">→</td>
                    <td>${fmt(summary.Ixx * L4)}</td>
                    <td>${fmt(summary.Iyy * L4)}</td>
                </tr>
            `;
            return `
                <h3 style="margin:20px 0 6px 0; font-size:14px;">
                    폐곡선별 단면특성 + 환산단면 도심축정리 (기준재료 M${refMatIdx})
                </h3>
                <div style="font-size:11px; margin-bottom:8px; color:#555; line-height:1.6;">
                    각 폐곡선에 대해 쉘레이스로 기하 단면특성(A<sub>k</sub>, C<sub>x,k</sub>, C<sub>y,k</sub>, I'<sub>xx,k</sub>, I'<sub>yy,k</sub>)을 구한 뒤
                    환산비 n<sub>k</sub> = E<sub>k</sub>/E<sub>ref</sub> 를 적용. <br>
                    환산도심 C<sub>x</sub> = Σ(n<sub>k</sub>A<sub>k</sub>·C<sub>x,k</sub>)/Σ(n<sub>k</sub>A<sub>k</sub>),
                    C<sub>y</sub> 동일. <br>
                    도심축정리 (편차 d<sub>x</sub>=C<sub>x,k</sub>−C<sub>x</sub>, d<sub>y</sub>=C<sub>y,k</sub>−C<sub>y</sub>): <br>
                    I<sub>xx</sub> = Σ(n<sub>k</sub>·I'<sub>xx,k</sub> + n<sub>k</sub>A<sub>k</sub>·d<sub>y</sub>²),
                    I<sub>yy</sub> = Σ(n<sub>k</sub>·I'<sub>yy,k</sub> + n<sub>k</sub>A<sub>k</sub>·d<sub>x</sub>²).
                </div>
                <div style="overflow-x:auto; max-width:100%;">
                <table class="result-table" style="font-size:11px;">
                    <tr>
                        <th rowspan="2">재료</th>
                        <th rowspan="2">E</th>
                        <th rowspan="2">n</th>
                        <th colspan="5">기하 단면특성 (재료별)</th>
                        <th rowspan="2">n·A (${u}²)</th>
                        <th colspan="2">편차 (${u})</th>
                        <th colspan="2">평행축 (${u}⁴)</th>
                        <th colspan="2">합산 기여 (${u}⁴)</th>
                    </tr>
                    <tr>
                        <th>A (${u}²)</th>
                        <th>C<sub>x,k</sub> (${u})</th>
                        <th>C<sub>y,k</sub> (${u})</th>
                        <th>I'<sub>xx,k</sub> (${u}⁴)</th>
                        <th>I'<sub>yy,k</sub> (${u}⁴)</th>
                        <th>d<sub>y</sub></th>
                        <th>d<sub>x</sub></th>
                        <th>n·A·d<sub>y</sub>²</th>
                        <th>n·A·d<sub>x</sub>²</th>
                        <th>I<sub>xx,k</sub></th>
                        <th>I<sub>yy,k</sub></th>
                    </tr>
                    ${rows}
                    ${sumRow}
                </table>
                </div>
            `;
        }

        function renderCompositeBreakdown(c, L, L2, L4, u) {
            const fmt = (val) => val.toFixed(4);
            let rows = '';
            for (const p of c.triangles) {
                const isTri = p.type === 'tri';
                const classes = ['piece-row'];
                if (p.A < 0) classes.push('neg');
                if (highlightedLabel === p.label) classes.push('highlighted');
                const typeSym = isTri ? '△' : '▭';
                const typeName = isTri ? '삼각형' : '직사각형';
                const edgeText = p.ids.length >= 2 ? p.ids.join('→') : '—';
                const matCell = materialCount === 2
                    ? `<td>M${p.matIdx || 1} (n=${(p.n != null ? p.n : 1).toFixed(3)})</td>`
                    : '';
                rows += `
                    <tr class="${classes.join(' ')}" onclick="highlightPiece('${p.label}')" title="클릭하여 그림에서 강조">
                        <td>${p.label}</td>
                        <td>${typeSym} ${typeName}</td>
                        ${matCell}
                        <td>${edgeText}</td>
                        <td>${fmt(p.width * L)}</td>
                        <td>${fmt(p.height * L)}</td>
                        <td>${fmt(p.A * L2)}</td>
                        <td>${fmt(p.cx * L)}</td>
                        <td>${fmt(p.cy * L)}</td>
                        <td>${fmt(p.Ixx_local * L4)}</td>
                        <td>${fmt(p.Ixx_parallel * L4)}</td>
                        <td>${fmt(p.Ixx_contrib * L4)}</td>
                        <td>${fmt(p.Iyy_local * L4)}</td>
                        <td>${fmt(p.Iyy_parallel * L4)}</td>
                        <td>${fmt(p.Iyy_contrib * L4)}</td>
                    </tr>
                `;
            }
            const Ixx_signed = c.A_signed >= 0 ? c.Ixx : -c.Ixx;
            const Iyy_signed = c.A_signed >= 0 ? c.Iyy : -c.Iyy;
            const sumColspan = materialCount === 2 ? 6 : 5;
            const sumRow = `
                <tr style="background:#e8e8e8; font-weight:bold;">
                    <td colspan="${sumColspan}">Σ (합계)</td>
                    <td>${fmt(c.A_signed * L2)}</td>
                    <td>${fmt(c.cx * L)}</td>
                    <td>${fmt(c.cy * L)}</td>
                    <td colspan="2" style="text-align:center;">→</td>
                    <td>${fmt(Ixx_signed * L4)}</td>
                    <td colspan="2" style="text-align:center;">→</td>
                    <td>${fmt(Iyy_signed * L4)}</td>
                </tr>
            `;
            const isPieces = currentInputMode === 'pieces';
            const heading = isPieces
                ? `조각 합산 상세 (직사각형 ${c.nRect}개 / 삼각형 ${c.nTri}개)`
                : `사다리꼴 분할 상세 (기준선 y = ${fmt(c.y_ref * L)} ${u}, ` +
                  `직사각형 ${c.nRect}개 / 삼각형 ${c.nTri}개)`;
            const description = isPieces
                ? `사용자 입력 조각 각각의 면적·도심·국부 단면2차모멘트를 구한 뒤
                   <b>도심축정리</b>로 합산:
                   I<sub>xx</sub> = Σ(I'<sub>xx,k</sub> + A<sub>k</sub>·(C<sub>y,k</sub>−C<sub>y</sub>)²),
                   I<sub>yy</sub> = Σ(I'<sub>yy,k</sub> + A<sub>k</sub>·(C<sub>x,k</sub>−C<sub>x</sub>)²).
                   조각 면적은 항상 양수 (재료 추가). b·h 부호는 직각이 바운딩 박스의 어느 코너(LL/LR/UR/UL)에 있는지만 지정.`
                : `각 변 P<sub>i</sub>→P<sub>i+1</sub>에 대해 기준선까지의 사다리꼴을
                   <b>직사각형(가로 부분)</b> + <b>삼각형(기울어진 윗부분)</b>으로 분해.
                   수직 변(Δx=0)은 기여 없음, 수평 변(Δy=0)은 직사각형만 생성, 기울어진 변은 둘 다 생성.
                   도심축정리로 합산: I<sub>xx</sub> = Σ(I'<sub>xx,k</sub> + A<sub>k</sub>·(C<sub>y,k</sub>−C<sub>y</sub>)²),
                   I<sub>yy</sub> = Σ(I'<sub>yy,k</sub> + A<sub>k</sub>·(C<sub>x,k</sub>−C<sub>x</sub>)²).
                   빨간 행은 음의 부호 면적(빈공간 / 보조 분할).`;
            const colSrc = isPieces ? '이름' : '변';
            return `
                <h3 style="margin:20px 0 6px 0; font-size:14px;">${heading}</h3>
                <div style="font-size:11px; margin-bottom:8px; color:#555; line-height:1.5;">
                    ${description}
                </div>
                <div style="overflow-x:auto; max-width:100%;">
                <table class="result-table" style="font-size:11px;">
                    <tr>
                        <th rowspan="2">#</th>
                        <th rowspan="2">유형</th>
                        ${materialCount === 2 ? '<th rowspan="2">재료 (n)</th>' : ''}
                        <th rowspan="2">${colSrc}</th>
                        <th rowspan="2">폭 b (${u})</th>
                        <th rowspan="2">높이 h (${u})</th>
                        <th rowspan="2">A<sub>k</sub> (${u}²)</th>
                        <th rowspan="2">C<sub>x,k</sub> (${u})</th>
                        <th rowspan="2">C<sub>y,k</sub> (${u})</th>
                        <th colspan="3">I<sub>xx</sub> 기여 (${u}⁴)</th>
                        <th colspan="3">I<sub>yy</sub> 기여 (${u}⁴)</th>
                    </tr>
                    <tr>
                        <th>I'<sub>xx,k</sub></th>
                        <th>A<sub>k</sub>·d<sub>y</sub>²</th>
                        <th>I<sub>xx,k</sub></th>
                        <th>I'<sub>yy,k</sub></th>
                        <th>A<sub>k</sub>·d<sub>x</sub>²</th>
                        <th>I<sub>yy,k</sub></th>
                    </tr>
                    ${rows}
                    ${sumRow}
                </table>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            updateExampleList();
            updatePlaceholder();
            updateRatioDisplay();
            renderResultTable(null);
            resizeCanvas();
            document.getElementById('coordinates').addEventListener('input', updateShape);
            document.getElementById('coordinates2').addEventListener('input', updateShape);
        });

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
